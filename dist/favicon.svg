<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="criiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <!-- Background Shield/Orb -->
  <rect width="64" height="64" rx="16" fill="#0f172a" />
  
  <!-- Outer Quantum / Cosmic Ring -->
  <ellipse cx="32" cy="32" rx="22" ry="9" stroke="url(#criiGrad)" stroke-width="2.5" transform="rotate(-30 32 32)" stroke-dasharray="4 2" />
  <ellipse cx="32" cy="32" rx="22" ry="9" stroke="url(#coreGrad)" stroke-width="2.5" transform="rotate(30 32 32)" />
  
  <!-- Central Scientific Core -->
  <circle cx="32" cy="32" r="6" fill="url(#coreGrad)" />
  
  <!-- Frontier Sparks -->
  <circle cx="16" cy="22" r="2" fill="#38bdf8" />
  <circle cx="48" cy="42" r="2" fill="#818cf8" />
</svg>
