# ==============================================================================
# Cloudflare Pages Configuration: Curiomas Research & Innovation Institute (CRII)
# ==============================================================================

name = "curiomas-crii"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

[vars]
INSTITUTE_NAME = "Curiomas Research & Innovation Institute"
ACRONYM = "CRII"
MOTTO = "Turning Curiosity into Action"
ADMIN_EMAIL = "harunabdullahrakin@gmail.com"
AUTZ_APP_ID = "gqiqh6qia"

# ==============================================================================
# Cloudflare D1 Database & R2 Storage Bindings
# ==============================================================================
[[d1_databases]]
binding = "DB"
database_name = "crii-production-db"
database_id = "b1d6a28c-8693-4526-812e-a7474ac87bc8"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "crii-storage"
