# ==============================================================================
# Cloudflare Pages Configuration: Curiomas Research & Innovation Institute (CRII)
# ==============================================================================

name = "curiomas-crii"
compatibility_date = "2024-09-01"
pages_build_output_dir = "."

[vars]
INSTITUTE_NAME = "Curiomas Research & Innovation Institute"
